[data]
name = qsoxqso
tracer1 = QSO
tracer2 = QSO
tracer1-type = discrete
tracer2-type = discrete
data_type = multipoles
filename = data/qsoauto_xipoles.txt
weights-tracer1 = data/qsoauto_zcat.fits
weights-tracer2 = data/qsoauto_zcat.fits
covariance-file = data/qsoauto_cov_20x20.txt

[cuts]
s-min = 50.0
s-max = 90.0

[model]
model_multipoles = 0,2
z evol QSO = bias_vs_z_std
velocity dispersion = gauss

[parameters]
par binsize qsoxqso = 4.
per binsize qsoxqso = 4.
