# .readthedocs.yaml
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    post_create_environment:
      # Install pip to ensure it's up to date
      - python -m pip install --upgrade pip

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
