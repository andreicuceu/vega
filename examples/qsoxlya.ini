# Vega correlation config file: QSO x Lya(Lya) cross-correlation
#
# Annotated catalogue of the options that configure the data, scale cuts and model of one
# correlation function. This file is listed under 'ini files' in [data sets] of main.ini.
# The values correspond to a DESI-like Lya BAO baseline.
# Options common to all correlations are documented in the same way as in lyaxlya.ini;
# the options specific to a discrete tracer (QSO) are documented in more detail here.
#
# Syntax notes:
# - Option names are case sensitive and must be written exactly as below. Vega mixes
#   spaces, hyphens and underscores in option names.
# - Inline comments are NOT supported, comments must be on their own line.
# - Several model options are activated by their mere presence in the file, independently
#   of their value (model-hcd, small scale nl, fullshape smoothing, velocity dispersion,
#   mock-bin-size). Comment them out to switch them off.
#
# Sections:
#   [data]          Required
#   [cuts]          Required (may be empty, but rp-min must be set for a cross-correlation)
#   [model]         Required
#   [metals]        Optional (no metal contamination is modelled without it)
#   [metal-matrix]  Required if [metals] is present and new_metals = True
#   [parameters]    Optional
#   [broadband]     Optional

# Data section
# Required
[data]
# Name of the correlation - Required
# Used to name the output HDUs, the binning parameters and broadband coefficients
# (e.g. 'par binsize qsoxlya'), and the mc_fiducial_<name> option in main.ini.
name = qsoxlya

# Tracer names and types - Required
# Names: LYA for the Lya forest (also for Lya absorption in the Lyb region), QSO for quasars.
# Types: continuous (absorption field) or discrete (point tracer).
# The tracer order sets the sign convention of rp (and of drp_QSO), so it should follow the
# convention of the measurement.
tracer1 = QSO
tracer2 = LYA
tracer1-type = discrete
tracer2-type = continuous

# Path of the measured correlation (picca format) - Optional
# HDU 1 must contain the DA (or DA_BLIND) column, and optionally CO (covariance),
# DM (distortion matrix) and NB. The header keywords OMEGAM, OMEGAK, OMEGAR and WL give the
# fiducial cosmology of the measurement, used to separate the QSO and forest redshifts in
# new-bias-evolution. If not given, Vega can only compute models.
filename = /path/to/xcf_exp.fits.gz

# Set to False to ignore 'filename' and only compute models - Optional
# Default: True
# has_datafile = True

# Distortion matrix in a separate file (picca format) - Optional
# If not given, the distortion matrix is read from the data file (DM column) if present.
distortion-file = /path/to/xdmat.fits.gz

# Apply the distortion matrix to the model - Optional
# Default: True
# distortion = True

# Covariance matrix in a separate file (CO column) - Optional
# If not given, the covariance is read from the data file. Ignored for the fit if
# global-cov-file is used in main.ini.
# covariance-file = /path/to/xcov.fits

# Rescale the covariance matrix of this correlation by a factor - Optional
# Default: not used
# cov_rescale = 1.0

# Apply the Hartlap correction to the covariance of this correlation - Optional
# Requires the NSAMPLES header keyword in the data (or covariance) file.
# Default: False
# apply_hartlap = False

# Use the Cholesky decomposition of the masked covariance (True) or of the full covariance
# (False) to generate Monte Carlo realisations - Optional
# Default: True
# cholesky-masked-cov = True

# Weights of the two tracers - Required with new_metals = True and catalog-bias-evolution
# Discrete tracers: object catalogue with a Z column (HDU 1).
# Continuous tracers: delta attributes file of picca (stacked LOGLAM and WEIGHT).
weights-tracer1 = /path/to/qso_catalog.fits
weights-tracer2 = /path/to/delta_attributes.fits.gz

# The redshift range of the pairs used to build the new metal matrices is read from the
# ZMIN/ZMAX header of the correlation file (no cut if absent). The former zmin/zmax options
# were removed: values equal to the header range are ignored with a warning, other values
# raise an error.

# Use identity metal matrices when they are missing from the picca metal file
# (new_metals = False only). For testing only - Optional
# Default: False
# test = False

##########

# Scale cuts [Mpc/h]
# Required
# A bin is used if rp-min < rp < rp-max, rt-min < rt < rt-max, r-min < r < r-max and
# mu-min < mu < mu-max, evaluated at the bin centres.
[cuts]
# The cross-correlation is measured for negative and positive rp. The default rp-min = 0
# would remove all rp < 0 bins, so rp-min must be set explicitly.
# Default: 0. and 300.
rp-min = -200.
rp-max = +200.

# Default: 0. and 300.
rt-min = 0.
rt-max = 200.

# Default: 10. and 180.
r-min = 10.
r-max = 180.

# Default: -1. and +1.
mu-min = -1.
mu-max = +1.

##########

# Model section
# Required
[model]

###### Bias evolution ######
# Redshift evolution of the bias of each tracer: 'z evol <tracer name>', or 'z evol' for
# all tracers without a specific entry.
# Any value not containing 'croom' gives a power law b(z) ~ (1 + z)^alpha_<tracer>.
# Values containing 'croom' give the Croom et al. (2005) QSO bias evolution
# (parameters croom_par0, croom_par1).
# Default: power law
z evol LYA = bias_vs_z_std
z evol QSO = bias_vs_z_std
# z evol QSO = croom

# Evaluate the bias evolution of the QSO and of the forest at their own redshifts,
# z_Q,F = z -/+ rp / (2 D_H(z)), instead of the mean redshift of the pair - Optional
# Requires the fiducial cosmology in the data header. Not compatible with croom.
# Default: False
# new-bias-evolution = False

# Average the bias evolution over the redshift distributions of the tracers given by
# weights-tracer1/2, normalized at their weighted mean redshifts - Optional
# Only for correlations involving a discrete tracer; supersedes new-bias-evolution.
# The catalogue weighting options (z_ref_objects, weight_evol_QSO, z_bins_objects,
# rebin_factor) are read from [metal-matrix] if present, otherwise from [model].
# Default: False
# catalog-bias-evolution = False

###### Discrete tracer effects ######
# Small-scale velocity dispersion and redshift errors of the discrete tracer - Optional
# lorentz: Lorentzian damping, parameter sigma_velo_disp_lorentz_<tracer> (e.g. _QSO)
# gauss: Gaussian damping, parameter sigma_velo_disp_gauss_<tracer>
# Default: not used
velocity dispersion = lorentz
# velocity dispersion = gauss

# The systematic shift of the quasar redshifts is modelled through the parameter
# drp_<tracer> (e.g. drp_QSO) in [parameters]. It shifts the rp coordinate of the model
# and is always active for a discrete x continuous correlation (default 0).

# QSO radiation effects (transverse proximity effect) on the smooth component - Optional
# Only for the QSO x LYA cross-correlation.
# Parameters: qso_rad_strength, qso_rad_asymmetry, qso_rad_lifetime, qso_rad_decrease
# qso_rad_strength is linear and can be listed in [analytic marginalization] of main.ini;
# its template depends on drp_QSO and is rebuilt at each evaluation.
# Default: False
radiation effects = True

# Relativistic corrections (Bonvin et al. 2014) - Optional
# Only for discrete x continuous correlations. Parameters: Arel1, Arel3
# Default: False
# relativistic correction = False

# Standard (odd-multipole) asymmetry - Optional
# Only for discrete x continuous correlations. Parameters: Aasy0, Aasy2, Aasy3
# Default: False
# standard asymmetry = False

# Evaluate the QSO radiation and UV shot-noise terms at the AP-rescaled coordinates -
# Optional
# Default: False
# rescale-coords-systematics = False

###### Non-linear corrections ######
# Small-scale non-linear correction - Optional
# dnl_arinyo: Arinyo-i-Prats et al. (2015). In a cross-correlation with one Lya tracer
#             the square root of D_NL is applied.
# Default: not used
# small scale nl = dnl_arinyo

# Do not apply the small-scale non-linear correction and the full-shape smoothing to the
# peak component - Optional
# Default: False
# skip-nl-model-in-peak = False

# Additional smoothing of the full power spectrum - Optional
# gauss: Gaussian smoothing with par_sigma_smooth / per_sigma_smooth (or the per-tracer
#        par_sigma_smooth_<tracer> / per_sigma_smooth_<tracer>)
# exp: Gaussian and exponential smoothing (also par_exp_smooth / per_exp_smooth)
# Default: not used
# fullshape smoothing = gauss

# Damping of the power spectrum at high k, P(k) x exp(-scale^2 k^power / 2) - Optional
# (scale in Mpc/h)
# Default: not used, and power = 2
# pk-damping-scale = 1.
# pk-damping-power = 2

###### High column density systems ######
# Model of the HCD contamination of the Lya forest - Optional
# Rogers2018: Rogers et al. (2018) template, parameters bias_hcd, beta_hcd, L0_hcd
# fvoigt: Voigt-profile template, parameters bias_hcd, beta_hcd, L0_fvoigt
# sinc: sinc template, parameters bias_hcd, beta_hcd, L0_sinc
# Correlation-specific HCD parameters bias_hcd_QSOxLYA and beta_hcd_QSOxLYA take precedence
# over bias_hcd and beta_hcd.
# Default: not used
model-hcd = Rogers2018
# model-hcd = fvoigt
# model-hcd = sinc

# Voigt-profile template for model-hcd = fvoigt - Optional
# Name of a file in vega/models/fvoigt_models (Fvoigt_<name>.txt) or full path.
# Available: exp, DR12_noterdame, DR12_prochaska, london_6.0, saclay_4.4
# fvoigt_model = exp

###### UV background and HeII reionization ######
# Apply to the LYA tracer of the cross-correlation - Optional
# Default: False
UVB-fluctuations = False
HeII-reionization = False

# UV background shot noise. Only intended for the Lya auto-correlation; in the
# cross-correlation it is for tests only - Optional
# Default: False
# UVB-shotnoise = False

# Note: desi-instrumental-systematics only applies to auto-correlations and raises an error
# in a cross-correlation.

###### Binning and Hankel transform ######
# Model the smoothing due to the (rp, rt) binning of the measurement - Optional
# Default: True
# model binning = True

# Number of mu_k bins used to compute the power spectrum multipoles - Optional
# Default: 1000
# num_bins_muk = 1000

# Highest (even) multipole summed in the Hankel transform from P(k) to xi - Optional
# Default: 6
ell_max = 6

# Use the old FFTLog algorithm from picca fitter2 instead of mcfit - Optional
# Default: False
old_fftlog = False

# Options of the mcfit Hankel transform - Optional
# Default: fht_extrap = False, fht_lowring = True
# fht_extrap = False
# fht_lowring = True

# Only compute one multipole of the model - Optional
# Default: -1 (sum all multipoles up to ell_max)
# single_multipole = -1

# Rescale the template coordinates for the difference between the fiducial cosmology of
# the measurement and that of the template - Optional
# Default: False
# apply-data-template-correction = False

###### Metals ######
# See lyaxlya.ini for a detailed description of these options.
# Compute the metal matrices from the tracer weights (True) or read them from the picca
# metal file (False, legacy). Default: False
new_metals = True

# Convention of the new metal matrices: estimator (default) or legacy.
# In the estimator convention the matrices include the amplitude evolution of both legs
# (QSO and metal), and new-bias-evolution is switched off for the metal terms.
metal_matrix_convention = estimator

# Default: False
# rp_only_metal_mats = False

# Default: 1
# rmu_metal_grid_factor = 1

# Fast metals. Default: False
fast_metals = True

# Required by analytically marginalized metal biases. Default: True
# fast_metal_bias = True

# Required by analytically marginalized metal biases. Default: True
# no-metal-decomp = True

# Default: False
# single-metal-beta = False

# Own amplitude amp_<metal1>_<metal2> for each metal x metal correlation. The QSO x Lya
# cross-correlation has only QSO x metal terms, which are linear in the metal biases, so
# this option has no effect here, and the metal biases can be marginalized analytically
# without it. Default: False
# metal-auto-amplitudes = False

###### Small-scale marginalization ######
# See lyaxlya.ini for a detailed description of these options.
# Default: not used
# marginalize-below-rtmax = 0.
# marginalize-above-rtmin = 0.
# marginalize-below-rpmax = 0.
# marginalize-above-rpmin = 0.
# marginalize-all-rmin-cuts = False
# marginalize-prior-sigma = 10.
# marginalize-match-data-bins = False
# fit-marginalized-scales = False

###### Broadband marginalization ######
# Marginalize analytically all the additive polynomial coefficients of [broadband], with a
# zero-mean Gaussian prior of width broadband-prior-sigma (flat if not given). Only for
# rp/rt data. See lyaxlya.ini for a detailed description and the restrictions.
# Default: False, flat prior
# marginalize-broadbands = False
# broadband-prior-sigma = 1e-4

###### Multipoles ######
# Fit Legendre multipoles (requires (r, mu) binned data) - Optional
# use_multipoles = False
# model_multipoles = 0,2
# weighted_multipoles = False

###### Mocks ######
# mock-bin-size = 2.
# mock-los-smoothing = growth

##########

# Metals section
# Optional
# Accepts the same P(k) options as [model]. By default only a Kaiser model (with binning
# smoothing) is used.
[metals]
# Path of the picca metal matrices (only used with new_metals = False)
# filename = /path/to/metal_xdmat.fits

# Redshift evolution of the metal biases
z evol = bias_vs_z_std

# Velocity dispersion of the QSO in the QSO x metal correlations
velocity dispersion = lorentz

# Metal species contaminating the forest (tracer2). The order does not matter.
# Only QSO x metal correlations are computed. CIV(eff) only enters through its
# auto-correlation, so it has no effect here and is left out.
in tracer2 = SiII(1190) SiII(1193) SiIII(1207) SiII(1260)

##########

# Metal-matrix section
# Required if [metals] is present and new_metals = True
[metal-matrix]
# Rebinning factor of the stacked forest weights - Optional
# Default: not rebinned
rebin_factor = 3

# Weighting exponent of the forest pixels in the estimator, (1 + z)^(weight_evol_LYA - 1)
# Deprecated name: alpha_LYA. Default: 2.9
weight_evol_LYA = 2.9

# Weighting exponent of the quasars in the estimator,
# ((1 + z) / (1 + z_ref_objects))^(weight_evol_QSO - 1)
# Deprecated name: z_evol_objects. Default: 1.44
weight_evol_QSO = 1.44

# Reference redshift of the quasar weights. Default: 2.25
z_ref_objects = 2.25

# Number of redshift bins of the quasar catalogue histogram. Default: 1000
z_bins_objects = 1000

# The amplitude exponents alpha_<metal> are read from [parameters] of main.ini.

##########

# Parameters section
# Optional
# Parameter values for this correlation. They are overwritten by [parameters] in main.ini.
[parameters]
# Bin sizes used to model the binning smoothing [Mpc/h]
# Default: bin sizes of the data
par binsize qsoxlya = 4.
per binsize qsoxlya = 4.

##########

# Broadband polynomials
# Optional
# See lyaxlya.ini for the syntax. Coefficients are named e.g.
#   BB-qsoxlya-0 add pre rp,rt (0,0)
# They need not be defined in [parameters] with marginalize-broadbands = True.
# [broadband]
# bb1 = add pre rp,rt 0:2:1 0:2:1
