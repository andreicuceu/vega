# Vega correlation config file: Lya(Lya) x Lya(Lya) auto-correlation
#
# Annotated catalogue of the options that configure the data, scale cuts and model of one
# correlation function. This file is listed under 'ini files' in [data sets] of main.ini.
# The values correspond to a DESI-like Lya BAO baseline.
#
# Syntax notes:
# - Option names are case sensitive and must be written exactly as below. Vega mixes
#   spaces, hyphens and underscores in option names.
# - Inline comments are NOT supported, comments must be on their own line.
# - Several model options are activated by their mere presence in the file, independently
#   of their value (model-hcd, small scale nl, fullshape smoothing, velocity dispersion,
#   mock-bin-size). Comment them out to switch them off.
#
# Sections:
#   [data]          Required
#   [cuts]          Required (may be empty)
#   [model]         Required
#   [metals]        Optional (no metal contamination is modelled without it)
#   [metal-matrix]  Required if [metals] is present and new_metals = True
#   [parameters]    Optional
#   [broadband]     Optional

# Data section
# Required
[data]
# Name of the correlation - Required
# Used to name the output HDUs, the binning parameters and broadband coefficients
# (e.g. 'par binsize lyaxlya'), and the mc_fiducial_<name> option in main.ini.
name = lyaxlya

# Tracer names and types - Required
# Names: LYA for the Lya forest (also for Lya absorption in the Lyb region), QSO for quasars.
# Types: continuous (absorption field) or discrete (point tracer).
# tracer2 and tracer2-type default to tracer1 and tracer1-type.
tracer1 = LYA
tracer2 = LYA
tracer1-type = continuous
tracer2-type = continuous

# Path of the measured correlation (picca format) - Optional
# HDU 1 must contain the DA (or DA_BLIND) column, and optionally CO (covariance),
# DM (distortion matrix) and NB. If not given, Vega can only compute models.
filename = /path/to/cf_exp.fits.gz

# Set to False to ignore 'filename' and only compute models - Optional
# Default: True
# has_datafile = True

# Distortion matrix in a separate file (picca format) - Optional
# If not given, the distortion matrix is read from the data file (DM column) if present.
distortion-file = /path/to/dmat.fits.gz

# Apply the distortion matrix to the model - Optional
# Default: True
# distortion = True

# Covariance matrix in a separate file (CO column) - Optional
# If not given, the covariance is read from the data file. Ignored for the fit if
# global-cov-file is used in main.ini.
# covariance-file = /path/to/cov.fits

# Rescale the covariance matrix of this correlation by a factor - Optional
# Default: not used
# cov_rescale = 1.0

# Apply the Hartlap correction to the covariance of this correlation - Optional
# Requires the NSAMPLES header keyword in the data (or covariance) file.
# Default: False
# apply_hartlap = False

# Use the Cholesky decomposition of the masked covariance (True) or of the full covariance
# (False) to generate Monte Carlo realisations - Optional
# Default: True
# cholesky-masked-cov = True

# Weights of the two tracers - Required with new_metals = True (and catalog-bias-evolution)
# Continuous tracers: delta attributes file of picca (stacked LOGLAM and WEIGHT, read from
# the STACK_DELTAS HDU if present, otherwise from HDU 1).
# Discrete tracers: object catalogue with a Z column.
# weights-tracer2 defaults to weights-tracer1.
weights-tracer1 = /path/to/delta_attributes.fits.gz
weights-tracer2 = /path/to/delta_attributes.fits.gz

# Redshift range of the pixel pairs used to build the new metal matrices - Optional
# Default: 0. and 10.
# zmin = 0.
# zmax = 10.

# Use identity metal matrices when they are missing from the picca metal file
# (new_metals = False only). For testing only - Optional
# Default: False
# test = False

##########

# Scale cuts [Mpc/h]
# Required (the section must exist, but can be empty to use the defaults)
# A bin is used if rp-min < rp < rp-max, rt-min < rt < rt-max, r-min < r < r-max and
# mu-min < mu < mu-max, evaluated at the bin centres.
[cuts]
# Default: 0. and 300.
rp-min = 0.
rp-max = 200.

# Default: 0. and 300.
rt-min = 0.
rt-max = 200.

# Default: 10. and 180.
r-min = 10.
r-max = 180.

# Default: -1. and +1.
mu-min = -1.
mu-max = +1.

##########

# Model section
# Required
[model]

###### Bias evolution ######
# Redshift evolution of the bias of each tracer: 'z evol <tracer name>', or 'z evol' for
# all tracers without a specific entry.
# Any value not containing 'croom' gives a power law b(z) ~ (1 + z)^alpha_<tracer>.
# Values containing 'croom' give the Croom et al. (2005) evolution (QSO only).
# Default: power law
z evol LYA = bias_vs_z_std

###### Non-linear corrections ######
# Small-scale non-linear correction of the Lya flux power spectrum - Optional
# dnl_arinyo: Arinyo-i-Prats et al. (2015), parameters dnl_arinyo_*
# dnl_mcdonald: McDonald (2003), fixed fitting function (Lya auto only)
# Default: not used
small scale nl = dnl_arinyo
# small scale nl = dnl_mcdonald

# Do not apply the small-scale non-linear correction and the full-shape smoothing to the
# peak component - Optional
# Default: False
# skip-nl-model-in-peak = False

# Additional smoothing of the full power spectrum - Optional
# gauss: Gaussian smoothing with par_sigma_smooth / per_sigma_smooth
# exp: Gaussian and exponential smoothing (also par_exp_smooth / per_exp_smooth)
# Default: not used
# fullshape smoothing = gauss

# Damping of the power spectrum at high k, P(k) x exp(-scale^2 k^power / 2) - Optional
# (scale in Mpc/h)
# Default: not used, and power = 2
# pk-damping-scale = 1.
# pk-damping-power = 2

###### High column density systems ######
# Model of the HCD contamination - Optional
# Rogers2018: Rogers et al. (2018) template, parameters bias_hcd, beta_hcd, L0_hcd
# fvoigt: Voigt-profile template, parameters bias_hcd, beta_hcd, L0_fvoigt
# sinc: sinc template, parameters bias_hcd, beta_hcd, L0_sinc
# Default: not used
model-hcd = Rogers2018
# model-hcd = fvoigt
# model-hcd = sinc

# Voigt-profile template for model-hcd = fvoigt - Optional
# Name of a file in vega/models/fvoigt_models (Fvoigt_<name>.txt) or full path.
# Available: exp, DR12_noterdame, DR12_prochaska, london_6.0, saclay_4.4
# fvoigt_model = exp

###### Instrumental and astrophysical systematics ######
# DESI instrumental systematics: correlated noise from sky subtraction, added to the
# smooth component in the first rp bin. Auto-correlations only - Optional
# Parameter: desi_inst_sys_amp
# Default: False
desi-instrumental-systematics = True

# UV background fluctuations (scale-dependent Lya bias) - Optional
# Parameters: bias_gamma, bias_prim, lambda_uv
# Default: False
UVB-fluctuations = False

# UV background shot noise. Intended for the Lya auto-correlation - Optional
# Parameters: uv_shotnoise_amp, lambda_uv, bias_gamma (or bias_gamma_e)
# Default: False
# UVB-shotnoise = False

# HeII reionization fluctuations - Optional
# Parameters: bias_gamma_e, bias_prim, lambda_HeII
# Default: False
HeII-reionization = False

###### Binning and Hankel transform ######
# Model the smoothing due to the (rp, rt) binning of the measurement - Optional
# The bin sizes are read from the data and can be overwritten with the
# 'par binsize <name>' and 'per binsize <name>' parameters ('r binsize <name>' for
# (r, mu) binning).
# Default: True
# model binning = True

# Number of mu_k bins used to compute the power spectrum multipoles - Optional
# Default: 1000
# num_bins_muk = 1000

# Highest (even) multipole summed in the Hankel transform from P(k) to xi - Optional
# Default: 6
ell_max = 6

# Use the old FFTLog algorithm from picca fitter2 instead of mcfit - Optional
# Default: False
old_fftlog = False

# Options of the mcfit Hankel transform - Optional
# Default: fht_extrap = False, fht_lowring = True
# fht_extrap = False
# fht_lowring = True

# Only compute one multipole of the model (e.g. 0 for the monopole) - Optional
# Default: -1 (sum all multipoles up to ell_max)
# single_multipole = -1

# Rescale the template coordinates for the difference between the fiducial cosmology of
# the measurement (OMEGAM, OMEGAK, OMEGAR, WL header keywords) and that of the template -
# Optional
# Default: False
# apply-data-template-correction = False

###### Metals ######
# Compute the metal matrices from the stacked weights of the deltas (True), or read them
# from the picca metal file given in [metals] (False, legacy) - Optional
# The picca metal matrices count the redshift evolution of the metals twice.
# True is strongly recommended and requires weights-tracer1/2 in [data] and [metal-matrix].
# Default: False
new_metals = True

# Convention of the new metal matrices (new_metals = True) - Optional
# estimator: expectation value of the pair estimator, including the amplitude evolution of
#            both legs normalized at zeff. The alpha_<tracer> and alpha_<metal> exponents are
#            taken from [parameters] at initialization and cannot be varied.
# legacy: previous convention (columns normalized to unit sum, evolution applied at runtime).
#         Kept to reproduce previous results; it counts the redshift evolution twice.
# Default: estimator
metal_matrix_convention = estimator

# Compute only the rp metal matrices (applied separately to each rt bin) instead of the
# full (rp, rt) matrices (new_metals = True) - Optional. Faster, approximate.
# Default: False
# rp_only_metal_mats = False

# Upsampling factor of the (rp, rt) grid of the metal matrices for (r, mu) binned data -
# Optional
# Default: 1
# rmu_metal_grid_factor = 1

# Fast metals - Optional
# Each metal x metal correlation is computed once at the first evaluation and then only
# rescaled by the metal biases; main x metal correlations with equal betas share one
# computation. About 10x faster for Lya x Lya. Refused together with varied beta_metals,
# beta_<metal> or alpha_<metal>, no-metal-decomp = False, metal-scaling = True,
# and write_cf/write_pk.
# Default: False
fast_metals = True

# Factor the bias product out of the metal correlations (it is then applied after the
# Hankel transform) - Optional. Always True with fast_metals or separate-metal-auto-biases.
# Default: True
# fast_metal_bias = True

# Include the SiII x SiII correlations between different SiII lines - Optional
# CIV(eff) always enters only through its auto-correlation.
# Default: True
use_metal_autos = True

# Compute the metal correlations from the full template P(k) and add them to the smooth
# component (True), or compute them separately for the peak and smooth components
# (False) - Optional
# Default: True
# no-metal-decomp = True

# Use one beta for all metals (parameter beta_metals) - Optional
# Default: False
# single-metal-beta = False

# Free amplitude for each metal x metal correlation of different species
# (parameters bias_<metal1>_<metal2>) - Optional
# Default: False
# separate-metal-auto-biases = False

###### Small-scale marginalization ######
# Analytic marginalization over free amplitudes of the undistorted model bins in a range
# of scales (one template per bin), to remove small-scale information - Optional
# Marginalize bins with rt < rtmax / rt > rtmin / |rp| < rpmax / |rp| > rpmin [Mpc/h].
# Several options select the intersection of the ranges.
# Default: not used
# marginalize-below-rtmax = 0.
# marginalize-above-rtmin = 0.
# marginalize-below-rpmax = 0.
# marginalize-above-rpmin = 0.

# Marginalize all the undistorted bins that fall below the rp-min, rt-min and r-min cuts
# Default: False
# marginalize-all-rmin-cuts = False

# Gaussian prior width of the template amplitudes
# Default: 10.
# marginalize-prior-sigma = 10.

# Use one template per distorted (data) bin instead of per undistorted bin
# Default: False
# marginalize-match-data-bins = False

# Without prior on the template amplitudes. Only with marginalize-match-data-bins = True.
# Default: False
# fit-marginalized-scales = False

###### Multipoles ######
# Fit Legendre multipoles of the correlation instead of the 2D correlation - Optional
# Requires data in (r, mu) binning (RMU_BIN header keyword).
# Default: False
# use_multipoles = False
# Comma-separated multipoles to fit. Default: 0,2
# model_multipoles = 0,2
# Inverse-variance weights in the projection onto multipoles. Default: False
# weighted_multipoles = False

###### Mocks ######
# Model the pixel smoothing of synthetic spectra with a bin size [Mpc/h] - Optional
# Default: not used
# mock-bin-size = 2.
# Line-of-sight variant of the smoothing: growth (par size x (1 + growth_rate)),
# amplitude (par size x (1 + los_smooth_amp)) or only-los (no transverse smoothing)
# mock-los-smoothing = growth

##########

# Metals section
# Optional
# The [metals] section configures the power spectra and correlation functions of the metal
# terms (Lya x metal and metal x metal). It accepts the same P(k) options as [model]
# (e.g. model-hcd, fullshape smoothing, model binning). By default only a Kaiser model
# (with binning smoothing) is used.
[metals]
# Path of the picca metal matrices (only used with new_metals = False)
# filename = /path/to/metal_dmat.fits

# Redshift evolution of the metal biases (same values as 'z evol' in [model])
z evol = bias_vs_z_std

# Metal species contaminating the first and second tracer. The order does not matter.
# Available: SiII(1190), SiII(1193), SiIII(1207), SiII(1260), CIV(eff), and any other
# absorber known to picca.constants.ABSORBER_IGM.
in tracer1 = SiII(1190) SiII(1193) SiIII(1207) SiII(1260) CIV(eff)
in tracer2 = SiII(1190) SiII(1193) SiIII(1207) SiII(1260) CIV(eff)

##########

# Metal-matrix section
# Required if [metals] is present and new_metals = True
[metal-matrix]
# Rebinning factor of the stacked forest weights (speeds up the computation) - Optional
# Default: not rebinned
rebin_factor = 3

# Weighting exponent of the correlation estimator for each main tracer:
# forest pixels weighted by (1 + z)^(weight_evol_LYA - 1) - Optional
# Deprecated name: alpha_LYA (still accepted with a warning)
# Default: 2.9
weight_evol_LYA = 2.9

# The amplitude exponents alpha_<metal> are read from [parameters] of main.ini.
# alpha_<metal> entries in this section are deprecated and only used with
# metal_matrix_convention = legacy.

##########

# Parameters section
# Optional
# Parameter values for this correlation. They are overwritten by [parameters] in main.ini.
[parameters]
# Bin sizes used to model the binning smoothing [Mpc/h] - Optional
# Default: bin sizes of the data
par binsize lyaxlya = 4.
per binsize lyaxlya = 4.

##########

# Broadband polynomials
# Optional
# Each line defines a polynomial term with an arbitrary key:
#   key = <type> <position> <coordinates> <r1_min:r1_max:step> <r2_min:r2_max:step> [broadband_sky]
# type:        add (added to the model) or mul (multiplies the model by 1 + polynomial)
# position:    pre (applied to the undistorted model) or post (after the distortion matrix)
# coordinates: rp,rt -> sum_ij c_ij (rp/100)^i (rt/100)^j
#              r,mu  -> sum_ij c_ij (r/100)^i mu^j
# The powers i and j run from min to max with the given step. Use step 1 for r1.
# The coefficients are named 'BB-<name>-<k> <type> <position> <coordinates> (<i>,<j>)',
# where k is the index of the line in this section (starting at 0), and must all be
# defined in [parameters] (and in [sample] to be fitted), e.g.
#   BB-lyaxlya-0 add pre rp,rt (0,0) = 0.
# The optional sixth element 'broadband_sky' replaces the polynomial by a Gaussian in rt
# in the first rp bin, modelling sky-subtraction residuals, with the parameters
#   BB-<name>-<k>-broadband_sky-scale-sky and BB-<name>-<k>-broadband_sky-sigma-sky
# [broadband]
# bb1 = add pre rp,rt 0:2:1 0:2:1
# bb2 = add post r,mu 0:2:1 0:6:2
# bb3 = add pre rp,rt 0:0:1 0:0:1 broadband_sky
