[data]
name = qsoxqso
tracer1 = QSO
tracer2 = QSO
tracer1-type = discrete
tracer2-type = discrete
data_type = multipoles
filename = /path/to/QSOauto/multipoles/xipoles.txt 
weights-tracer1 = /path/to/QSO/catalog.fits
weights-tracer2 = /path/to/QSO/catalog.fits
covariance-file = /path/to/QSO/covariance.txt

[cuts]
s-min = 50.0
s-max = 150.0

[model]
model_multipoles = 0,2
z evol QSO = bias_vs_z_std
velocity dispersion = lorentz
