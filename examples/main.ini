##### Broadband polynomials #####
# Every coefficient of every broadband term in the correlation configs must be defined,
# except in correlations with marginalize-broadbands = True, whose additive polynomial
# coefficients are marginalized analytically (missing values are set to zero).
# See lyaxlya.ini for the naming convention. Example for one term of order (0:2, 0:2):
# BB-lyaxlya-0 add pre rp,rt (0,0) = 0.
# BB-lyaxlya-0 add pre rp,rt (0,1) = 0.
# ...

##########

# PolyChord config - capitalised because this section is passed to an external program
# Required if run_sampler = True and sampler = Polychord
[Polychord]
# Path of the output folder - Required. The folder must exist.
path = /path/to/output/sampler
# Name of the run. PolyChord creates several output files in the folder specified
# above, and this is their prefix - Required
name = lyaxlya_qsoxlya-baseline

# Number of live points - Important, Optional
# Default: 25 * num_params. Increase for better accuracy
num_live = 512

# Precision requirement for terminating the chain - Important, Optional
# Default: 0.001. Change this on the log scale
# e.g. go to 1e-4 or 1e-5 for better precision
precision = 0.001

# Number of repeats when slice sampling - Important, Optional
# Default: 5 * num_params. This is important for the evidence;
# lower values are sufficient if only the posterior is needed
num_repeats = 20

# Seed - Optional
# Default: 0 (negative values give a random seed)
seed = 0

# Add more samples to the posterior - Optional
# For better plots and summary statistics
# Default: 0.0
boost_posterior = 0.0

# Resume from a previous run - Optional
# This should almost always be True
# Default: True
resume = True

# Run separate clusters (for multimodal posteriors) - Optional
# Default: False
do_clustering = True

# Output posteriors for separate clusters - Optional
# Default: False
cluster_posteriors = False

# Write dead points to file - Optional
# Default: True
write_dead = True

# Perform a maximisation of the posterior at the end of the run - Optional
# Default: False
maximise = False

# Write LaTeX parameter names to the getdist .paramnames file - Optional
# Default: True
getdist_latex = True

##########

# PocoMC config - capitalised because this section is passed to an external program
# Required if run_sampler = True and sampler = PocoMC
# Optional
[PocoMC]
# Path of the output folder - Required. The folder must exist.
path = /path/to/output/sampler
# Name of the run. PocoMC creates several output files in the folder specified
# above, and this is their prefix - Required
name = lyaxlya_qsoxlya-baseline

# Use MPI (True) or multiprocessing (False) - Optional
# Default: False
use_mpi = True

# Number of processes in multiprocessing mode - Optional
# Default: 64
num_cpu = 64

# Write LaTeX parameter names to the getdist .paramnames file - Optional
# Default: True
getdist_latex = True

# These options are passed to PocoMC (defaults in brackets)
# For detailed descriptions see: https://pocomc.readthedocs.io/en/latest/sampling.html
# precondition (True), dynamic (False), n_effective (512), n_active (256),
# n_total (1024), n_evidence (0), save_every (3)
precondition = True
dynamic = False
n_effective = 512
n_active = 256
n_total = 1024
n_evidence = 0
save_every = 3
