# Vega main config file: annotated catalogue of options
#
# This file controls the data-set level setup of a Vega run: which correlation functions
# are fitted, the fiducial linear power spectrum, the cosmological (BAO/AP) parametrisation,
# the model parameters, the sampled parameters and priors, the fitter/sampler settings,
# Monte Carlo simulations and the output.
# The modelling of each correlation function is configured in its own config file
# (see lyaxlya.ini and qsoxlya.ini), listed under [data sets].
#
# The values below correspond to a DESI-like Lya BAO baseline: Lya(Lya)xLya(Lya) and
# QSOxLya(Lya) fitted jointly at z_eff = 2.33 with the Planck 2018 template.
#
# Syntax notes:
# - Option names are case sensitive and must be written exactly as below. Vega mixes
#   spaces, hyphens and underscores in option names.
# - Inline comments are NOT supported. Everything after the '=' sign is read as the value,
#   so comments must always be on their own line.
# - Paths may contain environment variables (e.g. $SCRATCH), which are expanded.
#
# Sections:
#   [data sets]       Required
#   [cosmo-fit type]  Required
#   [fiducial]        Required
#   [control]         Required (may be empty)
#   [output]          Required
#   [sample]          Required (may be empty)
#   [analytic marginalization]  Optional
#   [parameters]      Required
#   [priors]          Optional
#   [chi2 scan]       Optional
#   [monte carlo]     Optional (requires [mc parameters])
#   [mc parameters]   Optional (required if [monte carlo] is present)
#   [Polychord]       Optional (required if run_sampler = True and sampler = Polychord)
#   [PocoMC]          Optional (required if run_sampler = True and sampler = PocoMC)
#
# Note that the [broadband] section is read from the individual correlation config files,
# not from this file. See lyaxlya.ini for the broadband specification syntax.
#
# Analytic marginalization of linear parameters (see docs/analytic_marginalization.rst):
# - Per-correlation families of coefficients, selected in [model] of each correlation
#   config: the small-scale templates (marginalize-* options) and the additive broadband
#   polynomials (marginalize-broadbands, broadband-prior-sigma). See lyaxlya.ini.
# - Individual linear parameters, listed in the [analytic marginalization] section below:
#   desi_inst_sys_amp, qso_rad_strength, the metal biases and the metal x metal amplitudes.
# All marginalized coefficients follow one convention: the model is evaluated with them
# set to zero, and they are marginalized with their prior (zero-mean Gaussian for the
# per-correlation families, [priors] or flat for the [analytic marginalization] parameters).
# Their values in [parameters] do not enter the likelihood and may be omitted.

##########

# Data sets section
# Required
[data sets]
# Effective redshift of the measurement - Required
# All model terms (bias and growth evolution, metal matrices) are normalized at this redshift.
# It should match the redshift of the fiducial template (ZREF), otherwise the template P(k)
# is rescaled by ((1 + ZREF) / (1 + zeff))^2.
zeff = 2.33

# Space-separated list of the correlation config files - Required
# Full paths are recommended (relative paths are also searched inside the vega package).
ini files = /path/to/lyaxlya.ini /path/to/qsoxlya.ini

# Global (joint) covariance matrix of all the correlations listed above - Optional
# FITS file with a 'COV' column in HDU 1. The ordering of the data vector must follow the
# order of 'ini files'. If given, it replaces the individual covariance matrices.
# Default: not used
global-cov-file = /path/to/global-cov.fits

# Apply the Hartlap correction to the global covariance - Optional
# Requires the NSAMPLES header keyword in the global covariance file.
# The corresponding Percival correction is computed and stored in the output, but must be
# applied to the parameter covariance manually.
# Default: False
apply-global-hartlap = False

##########

# Cosmological (scale) parametrisation of the model
# Required
#
# The model is split into a peak (BAO wiggles) and a smooth (no-wiggle) component,
# xi = bao_amp * xi_peak + xi_smooth, and the coordinates of each component can be rescaled
# by alpha_parallel (ap) and alpha_transverse (at) along and across the line of sight.
#
# 'cosmo fit func' selects the parametrisation of the peak rescaling:
#   ap_at         ap and at directly (standard anisotropic BAO). Parameters: ap, at
#   aiso_epsilon  isotropic dilation and anisotropic warping:
#                 ap = aiso (1 + epsilon)^2, at = aiso / (1 + epsilon). Parameters: aiso, epsilon
#   phi_alpha     Lya AP parametrisation (Cuceu et al. 2021, arXiv:2103.14075):
#                 phi = at / ap, alpha = sqrt(ap * at). Parameters: phi, alpha
#   aiso_aap      DESI convention: aiso = (ap * at^2)^(1/3), aap = ap / at.
#                 Parameters: aiso, aap. Only available for the peak (BAO) rescaling.
# Default: ap_at
#
# The remaining flags control how (and if) the smooth component is rescaled:
#
###### BAO fits ######
# Use ap_at (or aiso_aap) and set all other flags to False. Only the peak is rescaled.
#
###### Full-shape (AP) fits ######
# These require phi_alpha (unless full-shape-alpha = True).
# - Peak/smooth AP configuration: smooth-scaling = True, full-shape = False.
#   Peak rescaled by (phi, alpha), smooth by (phi_smooth, alpha_smooth).
# - Full-shape AP configuration: full-shape = True, full-shape-alpha = False.
#   The AP parameter is shared: peak rescaled by (phi_full, alpha), smooth by
#   (phi_full, alpha_smooth). The smooth-scaling flag is irrelevant in this case.
# - Galaxy-like full-shape configuration (full isotropic rescaling): full-shape = True and
#   full-shape-alpha = True. Peak and smooth both rescaled by (phi_full, alpha_full).
#   With full-shape-alpha = True the other parametrisations are also allowed and use
#   ap_full/at_full (ap_at) or aiso_full/epsilon_full (aiso_epsilon).
[cosmo-fit type]
cosmo fit func = ap_at
# cosmo fit func = phi_alpha
# cosmo fit func = aiso_epsilon
# cosmo fit func = aiso_aap

# Rescale both components with the full-shape parameters. Default: False
full-shape = False

# Use a single isotropic dilation (alpha_full) for both components. Default: False
full-shape-alpha = False

# Rescale the smooth component. Default: False
smooth-scaling = False

# Apply the scale rescaling also to the metal correlations - Optional
# If False, the metal correlations are always computed with ap = at = 1.
# Incompatible with fast_metals = True and with two-alpha-smooth.
# Default: False
metal-scaling = False

# Use a separate smooth isotropic dilation for each correlation - Optional
# The smooth component of each correlation is then rescaled by (phi_smooth or phi_full,
# alpha_smooth_<tracer1>x<tracer2>), e.g. alpha_smooth_LYAxLYA and alpha_smooth_QSOxLYA.
# Only for phi_alpha. Incompatible with full-shape-alpha and metal-scaling.
# Default: False
two-alpha-smooth = False

##########

# Fiducial linear power spectrum template
# Required
[fiducial]
# FITS file with columns K, PK (full linear P(k)) and PKSB (smooth, no-wiggle P(k)) and
# header keywords ZREF, OM, OL, DM, DH, and optionally F_ZREF (growth rate at ZREF).
# Relative paths are searched inside vega/models. Available templates include:
# Planck18/DESI-2024_z_2.33.fits, Planck18/Planck18_z_2.406.fits,
# PlanckDR16/PlanckDR16.fits, PlanckDR16/PlanckDR16_z_2.334.fits
# Templates can be produced with bin/make_template.py.
filename = Planck18/DESI-2024_z_2.33.fits

##########

# Control section
# Required (the section must exist, but can be empty)
[control]
# Take the growth rate from the template (F_ZREF header keyword) - Optional
# If True and the template provides F_ZREF, growth_rate in [parameters] is overwritten and
# growth_rate cannot be sampled. Set to False to use (or sample) growth_rate from [parameters].
# Default: True
use_template_growth_rate = True

# Run the sampler - Optional
# Samplers are run with bin/run_vega_mpi.py; run_vega.py only runs the minimizer.
# Default: False
run_sampler = False

# Which sampler to run - Required if run_sampler = True
# Options: Polychord, PocoMC. A section with the same name must exist in this file.
sampler = Polychord
# sampler = PocoMC

# Rescale the global covariance by this factor when it is read - Optional
# Affects both fits and Monte Carlo simulations. Only applies to the global covariance.
# Default: not used
# cov_scale = 1.0

# Compute the best-fit values of the analytically marginalized coefficients at every
# likelihood evaluation - Optional
# The likelihood is the same in both modes. With False, the coefficients are computed once,
# at the best fit found by the minimizer. With True, they are also computed at every
# evaluation that requests them, and the samplers save them as derived parameters of the
# chain (the [analytic marginalization] parameters under their own names).
# Default: False
marginalize-in-fit = False

# Low memory mode - Optional
# Only active together with global-cov-file. The individual covariance matrices are not
# stored, which saves memory when running many MPI processes.
# The best-fit values of analytically marginalized per-correlation coefficients need the
# original covariance, which this mode does not keep without a global covariance.
# Default: False
low_mem_mode = False

# Compute the model in Fourier space (power spectrum multipoles) instead of the
# correlation function - Optional. Experimental, used for P3D studies.
# Default: False
model_pk = False

###### Monte Carlo options ######
# See the [monte carlo] and [mc parameters] sections below, and
# examples/Monte_carlo_sims/README.md for a detailed description.

# Fit a Monte Carlo realisation (or a forecast) instead of the measured correlations - Optional
# Requires the [monte carlo] and [mc parameters] sections.
# Default: False
run_montecarlo = False

# Forecast mode - Optional
# The Monte Carlo "mock" is the noiseless fiducial model. Requires run_montecarlo = True.
# Only for run_vega.py and run_vega_mpi.py (refused by run_vega_mc_mpi.py).
# Default: False
forecast = False

# Seed of the Monte Carlo noise realisations - Optional
# run_vega_mc_mpi.py uses seed = mc_seed + MPI rank.
# Default: 0
mc_seed = 0

# Number of Monte Carlo realisations generated by run_vega_mc_mpi.py - Optional
# Default: 1
num_mc_mocks = 1

# Fit the Monte Carlo realisations generated by run_vega_mc_mpi.py - Optional
# If False, the realisations are only generated and written to [output] mc_output.
# Default: True
run_mc_fits = True

# Build the fiducial model of the Monte Carlo realisations from the best fit of an existing
# Vega output file - Optional
# Parameters in [mc parameters] take precedence over the best-fit values.
# If not given and [sample] is not empty, a fit to the data is run first and its best fit
# is used instead.
# Default: not used
# mc_start_from_fit = /path/to/vega/fit_output.fits

# Use measured correlations (e.g. a stack of mocks) as the fiducial model of the Monte Carlo
# realisations, instead of a Vega model - Optional
# The paths are given with mc_fiducial_<name>, where <name> is the 'name' option in [data]
# of each correlation config. Their DA column must have the full (uncut) data size.
# [mc parameters] is not used in this case.
# Default: False
use_measured_fiducial = False
# mc_fiducial_lyaxlya = /path/to/stacked/cf.fits
# mc_fiducial_qsoxlya = /path/to/stacked/xcf.fits

# Compute the Monte Carlo fiducial model directly from the full template P(k), without the
# peak/smooth decomposition - Optional. Used for direct inference (Cobaya interface).
# Default: False
use_full_pk_for_mc = False

# Rescale the global covariance only when generating the Monte Carlo noise - Optional
# Does not affect the covariance used in the fits.
# Default: not used
# global_cov_rescale = 1.0

# Options only read by bin/run_vega_mc_fits_mpi.py, which fits pre-generated realisations
# mc_mocks = /path/to/mc_output/monte_carlo.fits
# Do not apply the distortion matrices. Default: True
# use_distortion = True
# Slices of the realisations to fit (for cross-covariance studies). Default: not used
# slice_start1 = 0
# slice_end1 = 100
# slice_start2 = 0
# slice_end2 = 100

##########

# Output section
# Required
[output]
# Path of the output file - Required
# With analytically marginalized parameters, the fits output has a MARGCOEFF extension with
# the best-fit value and error of every marginalized coefficient, and the best-fit model
# includes their contribution. The BESTFIT header records the counts entering the degrees of
# freedom, NDATA - NSMALL - NFITPAR - NMARGOTH: fitted data points (NDATA), directly fitted
# parameters (NFITPAR), small-scale modes (NSMALL), other analytically marginalized
# coefficients (NMARGOTH) and all marginalized coefficients (NMARG).
filename = /path/to/output/lyaxlya_qsoxlya-baseline.fits

# Output format - Optional
# fits (default) or hdf (also: h5). The hdf output only contains the fit results and scans.
type = fits

# Overwrite the output file if it already exists - Optional
# Default: False
overwrite = False

# Write all the correlation function components (peak/smooth, core/metals, undistorted and
# distorted) to the output - Optional
# Not possible with fast_metals = True.
# Default: False
write_cf = False

# Write all the power spectrum components to the output - Optional
# Not possible with fast_metals = True.
# Default: False
write_pk = False

# Output directory for Monte Carlo runs - Optional, but recommended for MC runs
# Files are named monte_carlo.fits, or monte_carlo_<rank>.fits when run with MPI.
# Default: <directory of 'filename'>/monte_carlo
# mc_output = /path/to/output/monte_carlo

##########

# Scan config: start stop number_of_points
# One or two parameters only. The scanned parameters are fixed at each grid point while
# the parameters in [sample] are minimized. Only run by run_vega.py.
# Optional
# [chi2 scan]
# ap = 0.95 1.15 21
# at = 0.85 1.15 31

##########

# Sampled parameters
# Required (it can be empty, e.g. to only compute a model or with Monte Carlo runs)
#
# Parameters are only sampled if they are also defined in [parameters], otherwise they
# are skipped with a warning. Each parameter can be specified in one of these ways:
# par = True                  Use the default prior limits and step from
#                             vega/parameters/default_values.txt, and start at the
#                             value in [parameters]
# par = False                 Not sampled (equivalent to leaving it out)
# par = min max               Prior limits (full specification for the samplers). The
#                             minimizer starts at the value in [parameters] with the default step.
# par = min max start         Prior limits and starting point (minimizer only). Default step.
# par = min max start step    Full specification for the minimizer
# Limits can be None for the minimizer (unbounded), but the samplers require numbers.
# Parameters without an entry in default_values.txt need at least 'min max start step'.
# The linear parameters desi_inst_sys_amp, qso_rad_strength, bias_<metal> and
# amp_<metal1>_<metal2> can instead be marginalized analytically: move their lines to
# [analytic marginalization] (a parameter cannot be in both sections).
[sample]
ap = True
at = True

bias_LYA = True
beta_LYA = True

bias_QSO = True
sigma_velo_disp_lorentz_QSO = True
drp_QSO = True
qso_rad_strength = True

bias_hcd = True
beta_hcd = True
L0_hcd = True

bias_SiII(1190) = True
bias_SiII(1193) = True
bias_SiIII(1207) = True
bias_SiII(1260) = True
bias_CIV(eff) = True

desi_inst_sys_amp = True

# Examples of the explicit syntax
# bias_LYA = -0.5 0. -0.12 0.01
# beta_LYA = 0.5 3.0

##########

# Parameters marginalized analytically instead of sampled
# Optional
#
# Format: par = True (entries set to False are ignored). Supported parameters:
#   desi_inst_sys_amp      auto-correlations with desi-instrumental-systematics
#   qso_rad_strength       Lya x QSO correlations with radiation effects
#   bias_<metal> or        every correlation containing the metal. Requires
#   bias_eta_<metal>       metal-auto-amplitudes = True in the correlations with metal x metal
#                          terms of that metal, fast_metal_bias = True, no-metal-decomp = True,
#                          beta_<metal> (or beta_metals) in [parameters] and, for
#                          bias_eta_<metal>, no bias_<metal> entry.
#   amp_<metal1>_<metal2>  correlations with metal-auto-amplitudes = True that contain this
#                          metal x metal correlation (e.g. shared by Lya x Lya and Lya x Lyb)
# Each parameter is one coefficient, whose template (the response of the model to a unit
# value) is propagated through the distortion matrix of every correlation it enters.
# Templates that depend on the sampled parameters are rebuilt at each evaluation:
# qso_rad_strength (drp_QSO), the metal biases (Lya and QSO parameters) and, without
# fast_metals, the metal x metal amplitudes (a warning is printed). This adds a small cost
# per evaluation, but removes these parameters from the sampled space.
# Priors: Gaussian from [priors] (any mean), flat otherwise. The parameter bounds of
# default_values.txt do not apply; use a Gaussian prior if a flat one destabilizes the fit.
# Only rp/rt data are supported, and not model_pk or a model computed directly from the full
# power spectrum (for the metal parameters). Flat-prior templates must not be degenerate
# within the fitted bins.
# The minimizer uses the chi2 at the best-fit coefficients (including the prior penalty),
# and the samplers the likelihood integrated over the coefficients.
# [analytic marginalization]
# desi_inst_sys_amp = True
# qso_rad_strength = True
# bias_SiII(1190) = True
# bias_SiII(1193) = True
# bias_SiIII(1207) = True
# bias_SiII(1260) = True
# amp_SiII(1190)_SiII(1190) = True
# amp_SiII(1190)_SiII(1193) = True
# amp_CIV(eff)_CIV(eff) = True

##########

# Gaussian priors on sampled and analytically marginalized parameters
# Format: par = gaussian mean sigma
# Only Gaussian priors are supported, and only for parameters that are sampled
# (in [sample] or [monte carlo]) or listed in [analytic marginalization]. The priors of the
# latter are applied by the analytic marginalization, not added to the prior chi2.
# The per-correlation marginalized coefficients (small-scale templates, broadbands) take
# their priors from the correlation configs and must not appear here.
# Optional
[priors]
beta_hcd = gaussian 0.5 0.09
bias_CIV(eff) = gaussian -0.0243 0.0015
# desi_inst_sys_amp = gaussian 1e-4 1e-4

##########

# Monte Carlo sampled parameters
# Optional (requires [mc parameters] and run_montecarlo = True in [control])
#
# This section functions identically to [sample]. It specifies the parameters sampled when
# fitting the Monte Carlo realisations or forecasts. When running Monte Carlo, [sample]
# can be empty, so that no fit to the data is performed.
# [monte carlo]
# ap = True
# at = True
# bias_LYA = True
# beta_LYA = True

# Monte Carlo fiducial parameters
# Required if [monte carlo] is present (it can be empty)
# Parameters given here overwrite those used to compute the fiducial model of the
# realisations ([parameters], or the best fit if a fit is run first or mc_start_from_fit
# is used). Not used with use_measured_fiducial = True.
# [mc parameters]
# ap = 1.0
# at = 1.0

##########

# Model parameter values
# Required
# These overwrite the values given in the [parameters] sections of the individual
# correlation config files. The values of the sampled parameters are used as starting
# points of the minimizer. The values of analytically marginalized parameters do not enter
# the likelihood (a warning is printed if they are not zero); they are only used where the
# model is computed at fixed parameters, e.g. the fiducial model of Monte Carlo mocks.
[parameters]

##### Scale parameters #####
# Use one of the combinations below, consistently with [cosmo-fit type]:

# BAO config (ap_at)
ap = 1.0
at = 1.0

# BAO config (aiso_epsilon)
# aiso = 1.0
# epsilon = 0.0

# BAO config (aiso_aap)
# aiso = 1.0
# aap = 1.0

# Peak/smooth AP config (phi_alpha, smooth-scaling = True)
# phi = 1.0
# alpha = 1.0
# phi_smooth = 1.0
# alpha_smooth = 1.0

# Full-shape AP config (phi_alpha, full-shape = True)
# alpha = 1.0
# phi_full = 1.0
# alpha_smooth = 1.0
# With two-alpha-smooth = True, replace alpha_smooth by one parameter per correlation:
# alpha_smooth_LYAxLYA = 1.0
# alpha_smooth_QSOxLYA = 1.0

# Galaxy-like full-shape config (phi_alpha, full-shape = True, full-shape-alpha = True)
# phi_full = 1.0
# alpha_full = 1.0

##### BAO peak #####
# Amplitude of the peak component
bao_amp = 1.
# Non-linear broadening of the BAO peak along and across the line of sight [Mpc/h].
# If only one is given, the other is derived with a factor (1 + growth_rate).
sigmaNL_per = 3.24
sigmaNL_par = 6.36984

##### Linear growth rate #####
# Overwritten by the template value if use_template_growth_rate = True (default)
growth_rate = 0.970349063964458

##### Lya forest #####
# For each tracer two of (bias, bias_eta, beta) must be given, with
# bias_eta = bias * beta / growth_rate. If all three are given, bias and beta are used.
bias_LYA = -0.117
beta_LYA = 1.67
# bias_eta_LYA = -0.2
# Redshift evolution of the bias, b(z) ~ (1 + z)^alpha (with z evol LYA = bias_vs_z_std).
# Also enters the metal matrices in the estimator convention (cannot be varied then).
alpha_LYA = 2.9

##### Quasars #####
# beta_QSO is derived from bias_eta_QSO = 1, i.e. beta_QSO = growth_rate / bias_QSO
bias_QSO = 3.79
bias_eta_QSO = 1.
# beta_QSO = 0.26
alpha_QSO = 1.44
# Parameters of the Croom et al. (2005) bias evolution (z evol QSO = croom)
# croom_par0 = 0.53
# croom_par1 = 0.289
# Systematic shift of the QSO redshifts along the line of sight [Mpc/h]
drp_QSO = 0.0
# Small-scale velocity dispersion and redshift errors [Mpc/h] (velocity dispersion = lorentz or gauss)
sigma_velo_disp_lorentz_QSO = 6.86
# sigma_velo_disp_gauss_QSO = 2.

##### QSO radiation (transverse proximity) effects (radiation effects = True) #####
qso_rad_strength = 0.74
qso_rad_asymmetry = 0.
qso_rad_lifetime = 9e99
qso_rad_decrease = 300.

##### High column density systems (model-hcd) #####
bias_hcd = -0.05
beta_hcd = 0.5
# Characteristic length of the HCD damping wings [Mpc/h] for model-hcd = Rogers2018
L0_hcd = 6.5
# For model-hcd = fvoigt and sinc (default 1 if not given)
# L0_fvoigt = 1.
# L0_sinc = 1.
# Separate HCD parameters for an individual correlation, named with
# <tracer1>x<tracer2>. They take precedence over bias_hcd and beta_hcd.
# bias_hcd_QSOxLYA = -0.05
# beta_hcd_QSOxLYA = 0.5

##### Metals #####
# One set of (bias or bias_eta, beta, alpha) per metal species listed in [metals].
# alpha_<metal> is required in [parameters] when new_metals = True. In the estimator
# convention (default) it is built into the metal matrices and cannot be varied.
bias_SiII(1190) = -0.0052
beta_SiII(1190) = 0.5
alpha_SiII(1190) = 1.

bias_SiII(1193) = -0.0024
beta_SiII(1193) = 0.5
alpha_SiII(1193) = 1.

bias_SiIII(1207) = -0.0074
beta_SiIII(1207) = 0.5
alpha_SiIII(1207) = 1.

bias_SiII(1260) = -0.0046
beta_SiII(1260) = 0.5
alpha_SiII(1260) = 1.

bias_CIV(eff) = -0.0243
beta_CIV(eff) = 0.5
alpha_CIV(eff) = 0.

# Common beta of all metals, used with single-metal-beta = True
# beta_metals = 0.5

# Amplitudes of the metal x metal correlations, used with metal-auto-amplitudes = True
# Each metal x metal correlation is amp_<metal1>_<metal2> (metal names sorted) times the
# correlation computed with unit biases, replacing the product of the metal biases. One
# amplitude is shared by all correlations containing the pair. Every pair built by Vega needs
# a value (or an entry in [analytic marginalization]); values equal to the bias products
# reproduce the model without the option. They can be sampled like any other parameter.
# They replace the removed separate-metal-auto-biases option and its bias_<m1>_<m2> factors.
# amp_SiII(1190)_SiII(1190) = 2.704e-05
# amp_SiII(1190)_SiII(1193) = 1.248e-05
# amp_CIV(eff)_CIV(eff) = 5.9049e-04

##### Small-scale non-linearities (small scale nl = dnl_arinyo) #####
# Arinyo-i-Prats et al. (2015) D_NL parameters
dnl_arinyo_q1 = 0.8558
# dnl_arinyo_q2 = 0.
dnl_arinyo_kv = 1.11454
dnl_arinyo_av = 0.5378
dnl_arinyo_bv = 1.607
dnl_arinyo_kp = 19.47

##### DESI instrumental systematics (desi-instrumental-systematics = True) #####
# Amplitude of the correlated sky-subtraction noise in the forest auto-correlation
desi_inst_sys_amp = 1e-4

##### UV background fluctuations (UVB-fluctuations, UVB-shotnoise) #####
# bias_gamma = 0.1125
# bias_prim = -0.66
# lambda_uv = 300.
# uv_shotnoise_amp = 0.

##### HeII reionization (HeII-reionization = True) #####
# bias_gamma_e = 0.
# lambda_HeII = 50.

##### Relativistic effects and standard asymmetry in the cross-correlation #####
# (relativistic correction = True, standard asymmetry = True)
# Arel1 = -13.5
# Arel3 = 1.
# Aasy0 = 1.
# Aasy2 = 1.
# Aasy3 = 1.

##### Full-shape smoothing (fullshape smoothing = gauss or exp) #####
# Common Gaussian smoothing scales [Mpc/h]
# par_sigma_smooth = 6.
# per_sigma_smooth = 6.
# Per-tracer smoothing (used if the common ones are not given)
# par_sigma_smooth_LYA = 6.
# per_sigma_smooth_LYA = 6.
# par_sigma_smooth_QSO = 6.
# per_sigma_smooth_QSO = 6.
