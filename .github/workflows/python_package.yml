name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # lint:
  #   name: Code Quality (Ruff)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
      
  #     - name: Set up Python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.11"
  #         cache: "pip"
          
  #     - name: Install Ruff
  #       run: pip install ruff
        
  #     - name: Check formatting
  #       run: ruff format --check .
        
  #     - name: Lint code
  #       run: ruff check .

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # needs: lint # Only run tests if linting passes
    strategy:
      fail-fast: false # If one Python version fails, let the others finish
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          
      - name: Install system dependencies (MPI)
        # mpi4py requires system-level MPI headers to compile successfully on Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev
          
      - name: Install Vega and dependencies
        run: |
          python -m pip install --upgrade pip
          # Installs the package in editable mode with dev and mpi extras
          pip install -e .[dev,mpi]
          
      - name: Run tests with pytest
        run: |
          # Generates an XML report for Codecov
          pytest tests/ --cov=vega --cov-report=xml
          
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
