name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to release, for example v1.7.7
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate ${{ inputs.tag }}
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Check out release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation

      - name: Check out tagged source with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: source
          ref: ${{ inputs.tag }}

      - name: Validate the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the stable form vX.Y.Z" >&2
            exit 1
          fi
          git -C source show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          TAG_COMMIT=$(git -C source rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$(git -C source rev-parse HEAD)" = "$TAG_COMMIT"
          if ! git -C source merge-base --is-ancestor "$TAG_COMMIT" origin/master; then
            echo "$RELEASE_TAG is not reachable from origin/master" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; refusing to replace it" >&2
            exit 1
          fi
          RELEASE_VERSION=${RELEASE_TAG#v}
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: source/pyproject.toml

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "twine>=5.0"

      - name: Build and validate release distributions
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          python automation/.github/scripts/validate_distribution.py \
            --source source \
            --dist-dir "$RUNNER_TEMP/release-dist" \
            --work-dir "$RUNNER_TEMP/release-validation" \
            --expected-version "$RELEASE_VERSION"

      - name: Generate and verify checksums
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/release-dist"
          sha256sum \
            "vega-$RELEASE_VERSION.tar.gz" \
            "vega-$RELEASE_VERSION-py3-none-any.whl" \
            > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Retain the validated release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vega-${{ steps.tag.outputs.version }}-release
          path: |
            ${{ runner.temp }}/release-dist/vega-${{ steps.tag.outputs.version }}.tar.gz
            ${{ runner.temp }}/release-dist/vega-${{ steps.tag.outputs.version }}-py3-none-any.whl
            ${{ runner.temp }}/release-dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish ${{ inputs.tag }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vega-${{ needs.build.outputs.release_version }}-release
          path: ${{ runner.temp }}/release-artifacts

      - name: Verify retained artifacts
        run: sha256sum --check SHA256SUMS
        working-directory: ${{ runner.temp }}/release-artifacts

      - name: Create the GitHub Release
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/release-artifacts
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; refusing to replace it" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$ARTIFACT_DIR/vega-$RELEASE_VERSION.tar.gz" \
            "$ARTIFACT_DIR/vega-$RELEASE_VERSION-py3-none-any.whl" \
            "$ARTIFACT_DIR/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Vega $RELEASE_VERSION" \
            --generate-notes
